[project]
name = "sgtraffic"
version = "0.1.0"
description = "Retro 8-bit terminal viewer for live Singapore traffic camera feeds."
readme = "README.md"
authors = [
    { name = "leejianrong", email = "leejianrong2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "onnxruntime>=1.28.0",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
sgtraffic = "sgtraffic:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Two test layers, split by cost.
#
#   uv run pytest                 -> the fast layer only: no model, no network,
#                                    sub-second, and what the pre-push hook runs.
#   uv run pytest -m integration  -> the heavy layer under tests/integration:
#                                    downloads real ONNX models, creates real
#                                    sessions, and talks to the live camera API.
#
# `addopts` deselects the heavy layer by default; a later `-m` on the command
# line overrides it, which is what makes `-m integration` the opt-in switch.
# Integration modules must keep module-level imports cheap (onnxruntime is
# loaded lazily inside fixtures) because pytest still *imports* them before
# deselecting.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs a real ONNX model and/or the live Data.gov.sg API (deselected by default)",
]
