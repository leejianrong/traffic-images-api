[project]
name = "sgtraffic"
version = "0.1.0"
description = "Retro 8-bit terminal viewer for live Singapore traffic camera feeds."
readme = "README.md"
authors = [
    { name = "leejianrong", email = "leejianrong2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.scripts]
sgtraffic = "sgtraffic:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
